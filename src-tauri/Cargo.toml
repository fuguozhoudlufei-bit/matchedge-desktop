[package]
name = "matchedge-desktop"
version = "0.1.0"
description = "A football pre-match probability decision terminal."
authors = ["MatchEdge"]
edition = "2021"

[lib]
name = "matchedge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
